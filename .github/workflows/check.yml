name: Check research collector
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sh -n usb/collect.sh
      - run: python -m unittest discover -s tests -v
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: exhaust-research-usb
          path: dist/
